<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAUSTIC//LITE</title>
<meta name="description" content="Real-time water caustics with three.js in one small HTML file: a random sea, a rubber duck making ripples, turbulence, sun or lamp. Falls back to the CPU without WebGL.">
<style>
:root{--bg:#0e1012;--ink:#d9e4e8;--dim:#7f8e95;--cyan:#5fe3ff;--gold:#e5b95a;--cream:#efe6d2;--line:rgba(95,227,255,.16)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab} canvas:active{cursor:grabbing}
details{position:fixed;left:12px;top:12px;width:236px;padding:12px 16px 14px;background:rgba(14,16,18,.86);border:1px solid var(--line);backdrop-filter:blur(6px)}
details::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.028) 0 1px,transparent 1px 3px)}
summary{cursor:pointer;list-style:none;font:21px/1.1 Georgia,serif;letter-spacing:.06em;color:var(--cream)}
summary::-webkit-details-marker{display:none} summary b{color:var(--cyan);font-weight:400}
label{display:flex;justify-content:space-between;margin-top:10px;color:var(--dim)} label span{color:var(--ink)}
input{width:100%;margin:5px 0 0;accent-color:var(--cyan)}
input:focus-visible,button:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
.seg{display:flex;margin-top:12px;border:1px solid var(--line)}
.seg button{flex:1;padding:5px 0;border:0;background:transparent;color:var(--dim);font:inherit;cursor:pointer;position:relative;z-index:1}
.seg button[aria-pressed=true]{background:rgba(95,227,255,.14);color:var(--cyan)}
.chk{justify-content:flex-start;gap:8px;color:var(--ink);cursor:pointer} .chk input{width:auto;margin:0}
#stats{margin-top:12px;color:var(--gold);font-variant-numeric:tabular-nums}
p{margin:6px 0 0;color:var(--dim);font-size:11px}
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }</script>
</head>
<body>
<canvas id="view" role="img" aria-label="A glass tank of water on a tiled floor; light through the moving surface draws caustics on the tank floor"></canvas>
<details id="ui" open>
  <summary>CAUSTIC<b>//</b>LITE</summary>
  <div class="seg" role="group" aria-label="Light source"><button id="sun" aria-pressed="true">Sun</button><button id="lamp" aria-pressed="false">Lamp</button></div>
  <div id="sunCtl"><label for="elev">Sun height <span id="elevOut"></span></label><input id="elev" type="range" min="5" max="85" value="50">
    <label for="az">Sun direction <span id="azOut"></span></label><input id="az" type="range" min="0" max="360" value="225"></div>
  <div id="lampCtl" hidden><label for="lampH">Lamp height <span id="lampHOut"></span></label><input id="lampH" type="range" min="1.8" max="3.4" step="0.05" value="2.3">
    <label for="lampX">Lamp position <span id="lampXOut"></span></label><input id="lampX" type="range" min="-1.5" max="1.5" step="0.05" value="0.5"></div>
  <label for="waves">Waves <span id="wavesOut"></span></label><input id="waves" type="range" min="0" max="2" step="0.01" value="1">
  <label for="turb">Turbulence <span id="turbOut"></span></label><input id="turb" type="range" min="0" max="1" step="0.01" value="0.5">
  <label class="chk"><input id="duck" type="checkbox" checked> Rubber duck</label>
  <div id="stats"></div>
  <p>Drag to orbit · scroll or pinch to zoom · click the water for ripples (or near the duck to push it) · <kbd>R</kbd> random ripple · <kbd>D</kbd> duck · <kbd>L</kbd> sun or lamp · <kbd>Space</kbd> pause · <kbd>H</kbd> hide</p>
</details>
<script type="module">
// =====================================================================================
// CAUSTIC//LITE — light through moving water, focused into caustics on a tank floor. Built on
// three.js: a random sea and a rubber duck's ripples (a GPU ripple simulation) move the surface,
// a caustics texture is redrawn every frame, and small shaders follow each ray through the water.
// Without WebGL 2 (or offline, when three.js can't load) a small CPU renderer draws the same scene.
// =====================================================================================

// ---------------------------------------------------------------- the scene (metres)
const TX = 1.8, TZ = 1.1, TOP = 1.55;   // tank half-width (x), half-depth (z), rim height
const LEVEL = 1.2, IOR = 1.333;         // water level, refractive index of water
const ABSORB = [0.6, 0.1, 0.055];       // absorption per metre: red goes first, so water looks blue-green
const TARGET = [0, 0.55, 0], FOV = 42;

// ---------------------------------------------------------------- the water's own motion (both renderers)
// A random sea: 24 waves from 1.2 m down to 12 cm long, heading every which way (a golden-angle
// spread, so waves of neighbouring lengths never run side by side). Together they make a short-
// crested, random surface, and its caustics form a net of bright cells instead of stripes. Each wave's
// crests wander, and its height rises and falls on its own slow cycle, so the net keeps reshaping.
// Waves scales them all; Turbulence adds the short ones and livens the cycles. On top of that, a
// ripple simulation carries the rubber duck's wake, clicks and gusts across the tank and back off the glass.
const NW = 24, WAVES = [];
{
  let s = 5;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < NW; i++) {
    const len = 1.2 * 0.1 ** (i / (NW - 1)), k = 2 * Math.PI / len, dir = i * 2.39996 + (rnd() - 0.5) * 0.9;
    WAVES.push({ k, kx: k * Math.cos(dir), kz: k * Math.sin(dir), w: Math.sqrt(9.81 * k + 0.074 * k ** 3), ph: rnd() * 6.283,
      a: 0.55 * Math.min(1, (0.55 / len) ** 2) / (k * k) * (0.6 + 0.8 * rnd()), short: len < 0.3,   // the same curvature (a k^2) for most
      f1: 0.05 + 0.22 * rnd(), f2: 0.09 + 0.3 * rnd(), p1: rnd() * 6.283, p2: rnd() * 6.283 });
  }
}
const waveUniform = new Float32Array(NW * 4), ampUniform = new Float32Array(NW);
WAVES.forEach((W, i) => waveUniform.set([W.kx, W.kz, W.w, W.ph], i * 4));
function waveHeights(t, waves, turb) {   // each wave's height now (m)
  const swing = 0.35 + 0.55 * turb;
  WAVES.forEach((W, i) => { ampUniform[i] = W.a * Math.max(0.1, 1 + swing * (0.6 * Math.sin(W.f1 * t + W.p1) + 0.4 * Math.sin(W.f2 * t + W.p2)))
    * waves * (W.short ? 0.3 + 1.4 * turb : 1); });
}
// the sea at (x, z), as the GPU computes it -> o: height, slope x, slope z, and the water's horizontal velocity
function waveAt(x, z, o) {
  let h = 0, gx = 0, gz = 0, u = 0, v = 0;
  for (let i = 0; i < NW; i++) {   // each wave's crests are bent by a slower wave running along them
    const W = WAVES[i], k = W.k, kb = 0.37 * k, sx = -W.kz / k, sz = W.kx / k;
    const pb = kb * (sx * x + sz * z) + 0.9 * state.t + 7.1 * i, ph = W.kx * x + W.kz * z - W.w * state.t + W.ph + 1.6 * Math.sin(pb);
    const a = ampUniform[i], s = a * Math.sin(ph), cp = a * Math.cos(ph), b = 1.6 * kb * Math.cos(pb);
    h += s; gx += cp * (W.kx + b * sx); gz += cp * (W.kz + b * sz); u += s * W.w * W.kx / k; v += s * W.w * W.kz / k;
  }
  o[0] = h; o[1] = gx; o[2] = gz; o[3] = u; o[4] = v;
}

const $ = (id) => document.getElementById(id);
const state = { t: 0, paused: false, lamp: false, scale: 1, waves: 1, turb: 0.5 };
const drops = [];   // splashes waiting for the ripple simulation: x, z, radius (m), height (mm)
let splashAcc = 0;
function addRipple(x, z, h = 6, r = 0.06) { drops.push([x, z, r, h]); }
function turbulence(dt) {   // gusts ruffle the water here and there, more of them with more turbulence
  for (splashAcc += dt * 5 * state.turb; splashAcc >= 1; splashAcc -= 1)
    addRipple((Math.random() * 2 - 1) * TX * 0.95, (Math.random() * 2 - 1) * TZ * 0.95, (Math.random() < 0.5 ? -1 : 1) * (0.4 + Math.random()) * state.turb, 0.03 + 0.05 * Math.random());
}

// ---------------------------------------------------------------- the rubber duck
// The sandbox's duck. In duck units (body length 1; x forward, y up, the flat base at the origin),
// ellipsoids and a sphere make the body, tail, chest, head and wings, blended by a smooth minimum so
// they flow into each other; a flattened beak has a mouth line cut in; then two eyes. These are distance
// functions (negative inside): the GPU renderer turns them into a mesh once, the CPU one traces them.
// The duck drifts on a wandering breeze, sways with the waves, bobs and slowly turns; its hull pushes
// the water aside, and the ripple simulation spreads that into a wake and rings (see hull()).
const DS = 0.28, DRAFT = 0.125 * DS, FOOT = [0.43 * DS, 0.32 * DS];   // metres per duck unit; how deep it floats; its waterline (half-axes, m)
const ell = (x, y, z, a, b, c) => { x /= a; y /= b; z /= c; const k0 = Math.sqrt(x * x + y * y + z * z), k1 = Math.sqrt(x * x / (a * a) + y * y / (b * b) + z * z / (c * c)); return k0 * (k0 - 1) / k1; };
const smin = (a, b, k) => { const h = Math.min(Math.max(0.5 + 0.5 * (b - a) / k, 0), 1); return b + (a - b) * h - k * h * (1 - h); };
const box = (x, y, z, a, b, c, r) => { const qx = Math.abs(x) - a + r, qy = Math.abs(y) - b + r, qz = Math.abs(z) - c + r, ux = Math.max(qx, 0), uy = Math.max(qy, 0), uz = Math.max(qz, 0);
  return Math.sqrt(ux * ux + uy * uy + uz * uz) + Math.min(Math.max(qx, qy, qz), 0) - r; };
const TIP = [Math.cos(0.55), Math.sin(0.55), Math.cos(0.25), Math.sin(0.25), Math.cos(0.1), -Math.sin(0.1)];   // how the tail, wings and beak are tipped
function duckBody(x, y, z) {   // as duckShape() in the shaders
  const tx = x + 0.4, ty = y - 0.46, wx = x + 0.04, wy = y - 0.37, hx = x - 0.25, hy = y - 0.8;
  let d = ell(x, y - 0.28, z, 0.5, 0.3, 0.37);                                                         // body
  d = smin(d, ell(tx * TIP[0] + ty * TIP[1], ty * TIP[0] - tx * TIP[1], z, 0.2, 0.13, 0.15), 0.12);    // tail
  d = smin(d, ell(x - 0.22, y - 0.3, z, 0.3, 0.26, 0.31), 0.1);                                        // chest
  d = smin(d, Math.sqrt(hx * hx + hy * hy + z * z) - 0.25, 0.14);                                      // head
  d = smin(d, ell(wx * TIP[2] + wy * TIP[3], wy * TIP[2] - wx * TIP[3], Math.abs(z) - 0.29, 0.27, 0.12, 0.08), 0.05);   // wings
  return Math.max(d, box(x, y - 0.6, z, 1.2, 0.58, 1.2, 0.03));                                        // flat base
}
function duckBeak(x, y, z) {
  const bx = x - 0.53, by = y - 0.73;
  return Math.max(ell(bx * TIP[4] + by * TIP[5], by * TIP[4] - bx * TIP[5], z, 0.18, 0.065, 0.14), -box(x - 0.64, y - 0.725, z, 0.12, 0.007, 0.2, 0));
}
const EYE = [0.41, 0.9, 0.15, 0.055];   // eye centre (and its mirror image across z), radius
const pupil = (x, y, z) => Math.hypot(x - 0.44, y - 0.906, Math.abs(z) - 0.172) < 0.032;   // a black disc, looking forward and out
const DUCK = { on: true, x: 0.55, z: 0.25, vx: 0, vz: 0, head: 2.5, spin: 0, y: 0, vy: 0, pitch: 0, roll: 0, breeze: 0.9, draft: DRAFT };
const PUSH = 420;   // how much of the water the hull moves shows up as ripples (mm per m)
const dw = new Float32Array(5);
function duckStep(h, turb) {   // move the duck on by h seconds -> its hull before and after: x, z, heading, depth
  const D = DUCK, before = [D.x, D.z, D.head, D.on ? D.draft : 0];
  waveAt(D.x, D.z, dw);
  D.breeze += (Math.random() - 0.5) * Math.sqrt(h) * (0.6 + 2 * turb);
  const sp = 0.03 + 0.12 * turb, wall = (d) => Math.max(0, 0.5 - d) * 0.8;   // the glass pushes it back
  D.vx += (Math.cos(D.breeze) * sp + 0.9 * dw[3] + wall(TX + D.x) - wall(TX - D.x) - D.vx) * Math.min(1, 1.5 * h);
  D.vz += (Math.sin(D.breeze) * sp + 0.9 * dw[4] + wall(TZ + D.z) - wall(TZ - D.z) - D.vz) * Math.min(1, 1.5 * h);
  D.x = Math.min(Math.max(D.x + D.vx * h, 0.24 - TX), TX - 0.24); D.z = Math.min(Math.max(D.z + D.vz * h, 0.24 - TZ), TZ - 0.24);
  // it turns to face the way it drifts, with a slow random spin
  const want = Math.atan2(D.vz, D.vx);
  D.spin = D.spin * Math.exp(-h) + (Math.random() - 0.5) * Math.sqrt(h) * (0.4 + 1.5 * turb);
  D.head += (Math.atan2(Math.sin(want - D.head), Math.cos(want - D.head)) * Math.min(1, 6 * Math.hypot(D.vx, D.vz)) * 0.7 + D.spin) * h;
  // it bobs on a spring toward the water's height, knocked about more when it's turbulent, and leans with the slope
  D.vy += (-45 * (D.y - dw[0]) - 3.5 * D.vy) * h + (Math.random() - 0.5) * Math.sqrt(h) * 0.25 * turb;
  D.y += D.vy * h;
  D.draft = Math.max(0, DRAFT + dw[0] - D.y);
  const c = Math.cos(D.head), s = Math.sin(D.head), k = Math.min(1, 5 * h);
  D.pitch += (Math.atan(dw[1] * c + dw[2] * s) - D.pitch) * k;
  D.roll += (-Math.atan(dw[2] * c - dw[1] * s) - D.roll) * k;
  return [before, [D.x, D.z, D.head, D.on ? D.draft : 0]];
}
// how far below the water the hull reaches at (x, z) (m), for a hull state d: x, z, heading, depth
function hull(x, z, d) {
  const qx = x - d[0], qz = z - d[1], c = Math.cos(d[2]), s = Math.sin(d[2]);
  const u = (qx * c + qz * s) / FOOT[0], w = (qz * c - qx * s) / FOOT[1], r = Math.max(0, 1 - u * u - w * w); return d[3] * r * r;
}
function poke(x, z) {   // a click on the water: a ripple, and a shove for the duck if it's close
  addRipple(x, z);
  const dx = DUCK.x - x, dz = DUCK.z - z, d = Math.hypot(dx, dz);
  if (DUCK.on && d < 0.6) { const k = 0.35 * (1 - d / 0.6) / Math.max(d, 0.05); DUCK.vx += dx * k; DUCK.vz += dz * k; DUCK.vy -= 0.15; }
}

// light: the sun (a direction) or the lamp (a point above the tank), and what it does to the sky
function light() {
  if (state.lamp) return { lamp: true, pos: [+$('lampX').value, +$('lampH').value, 0.1], col: [6, 6 * 0.8, 6 * 0.58], amb: [0.012, 0.016, 0.028],
    glow: [0.004, 0.012, 0.014], day: 0.05 };
  const el = +$('elev').value * Math.PI / 180, az = +$('az').value * Math.PI / 180;
  const warm = Math.min(1, el / 0.5), day = 0.35 + 0.65 * Math.min(1, el / 0.6), I = 3.2, glow = 0.35 * I * Math.sin(el) + 0.4 * day;
  return { lamp: false, pos: [Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az)], col: [I, I * (0.62 + 0.36 * warm), I * (0.38 + 0.56 * warm)],
    amb: [0.3 * day, 0.42 * day, 0.62 * day], glow: [0.012 * glow, 0.07 * glow, 0.085 * glow], day };
}

// ================================================================= GPU: three.js
const f = (v) => (Number.isInteger(v) ? v.toFixed(1) : String(v));   // number -> GLSL float
const SIM = [256, 156];                                              // ripple grid: 1.4 cm cells
const CAUS = [512, 312];                                             // caustics texture: 7 mm texels
const COMMON = /* glsl */`
uniform float uLamp, uDay, uDuckOn;
uniform vec4 uDuck;                // the rubber duck: body centre, heading
uniform vec3 uLight, uLightCol, uAmb, uGlow;   // sun direction or lamp position; its colour; ambient; water glow
uniform sampler2D uSurf, uCaus;    // the water's height (m) and slope over the tank; light reaching the tank floor
const float PI = 3.14159265, LEVEL = ${f(LEVEL)}, IOR = ${f(IOR)}, DS = ${f(DS)};
const vec3 TANK = vec3(${f(TX)}, ${f(TOP)}, ${f(TZ)}), ABSORB = vec3(${ABSORB.map(f)}), YELLOW = vec3(0.92, 0.6, 0.012);

// water height above LEVEL and its slope at p: the sea and the ripples, drawn together once a frame (see surfMat)
vec3 wave(vec2 p) { return textureLod(uSurf, p / (2.0 * TANK.xz) + 0.5, 0.0).xyz; }
vec3 normalOf(vec3 w) { return normalize(vec3(-w.y, 1.0, -w.z)); }
// the duck's body, as duckBody() (duck units): ellipsoids and a sphere blended by a smooth minimum, a flat base
float ell(vec3 p, vec3 r) { float k0 = length(p / r), k1 = length(p / (r * r)); return k0 * (k0 - 1.0) / k1; }
float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
vec3 tipped(vec3 p, vec2 c, float a) { vec2 q = p.xy - c; return vec3(cos(a) * q.x + sin(a) * q.y, cos(a) * q.y - sin(a) * q.x, p.z); }
float duckShape(vec3 p) {
  float d = ell(p - vec3(0.0, 0.28, 0.0), vec3(0.5, 0.3, 0.37));
  d = smin(d, ell(tipped(p, vec2(-0.4, 0.46), 0.55), vec3(0.2, 0.13, 0.15)), 0.12);
  d = smin(d, ell(p - vec3(0.22, 0.3, 0.0), vec3(0.3, 0.26, 0.31)), 0.1);
  d = smin(d, length(p - vec3(0.25, 0.8, 0.0)) - 0.25, 0.14);
  d = smin(d, ell(tipped(vec3(p.xy, abs(p.z) - 0.29), vec2(-0.04, 0.37), 0.25), vec3(0.27, 0.12, 0.08)), 0.05);
  vec3 q = abs(p - vec3(0.0, 0.6, 0.0)) - vec3(1.17, 0.55, 1.17);
  return max(d, length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - 0.03);
}
// a point, or a direction, in the duck's frame: duck units, x forward (without its lean)
vec3 duckP(vec3 p) { vec2 f = vec2(cos(uDuck.w), sin(uDuck.w)); vec3 q = (p - uDuck.xyz) / DS; return vec3(dot(q.xz, f), q.y, dot(q.xz, vec2(-f.y, f.x))); }
vec3 duckV(vec3 v) { vec2 f = vec2(cos(uDuck.w), sin(uDuck.w)); return vec3(dot(v.xz, f), v.y, dot(v.xz, vec2(-f.y, f.x))); }
// a ray against the duck's body, marched through its distance function: distance (0 from inside, 1e9 on a miss), normal
float duck(vec3 ro, vec3 rd, out vec3 n) {
  n = vec3(0.0, 1.0, 0.0);
  vec3 o = duckP(ro), d = duckV(rd), c = o - vec3(-0.05, 0.53, 0.0);   // first, a ball round it
  float b = dot(c, d), h = b * b - dot(c, c) + 0.81;
  if (uDuckOn < 0.5 || h < 0.0) return 1e9;
  for (float t = max(-b - sqrt(h), 0.0), i = 0.0; i < 40.0 && t <= -b + sqrt(h); i++) {
    vec3 p = o + d * t; const vec2 k = vec2(0.003, -0.003);
    float e = duckShape(p);
    if (e < 0.002) {
      vec3 m = k.xyy * duckShape(p + k.xyy) + k.yyx * duckShape(p + k.yyx) + k.yxy * duckShape(p + k.yxy) + k.xxx * duckShape(p + k.xxx);
      vec2 f = vec2(cos(uDuck.w), sin(uDuck.w));
      n = normalize(vec3(m.x * f.x - m.z * f.y, m.y, m.x * f.y + m.z * f.x));
      return t * DS;
    }
    t += e;
  }
  return 1e9;
}
// how much of the light along a ray from p gets past the duck: 0 in its shadow, soft at the edges
// (light seldom comes from a single point), from how close the ray passes to its body and head
float duckClear(vec3 p, vec3 v) {
  if (uDuckOn < 0.5) return 1.0;
  vec3 o = duckP(p), e = duckV(v), R = vec3(0.5, 0.3, 0.37);
  vec3 a = (o - vec3(0.0, 0.28, 0.0)) / R, b = e / R, c = (o - vec3(0.25, 0.8, 0.0)) / 0.25, g = e / 0.25;
  return smoothstep(0.7, 1.35, length(a + b * max(-dot(a, b) / dot(b, b), 0.0)))
       * smoothstep(0.7, 1.35, length(c + g * max(-dot(c, g) / dot(g, g), 0.0)));
}
float fresnel(float c) { return 0.02 + 0.98 * pow(1.0 - clamp(c, 0.0, 1.0), 5.0); }   // Schlick, water

vec3 sky(vec3 d, float disk) {   // disk: how much of the sun's sharp disk to show (reflections use a softer glint)
  if (uLamp > 0.5) return vec3(0.01, 0.014, 0.026) * (1.2 - 0.6 * clamp(d.y, 0.0, 1.0));   // night
  float s = dot(d, uLight), g = max(s, 0.0);
  vec3 c = mix(vec3(0.56, 0.67, 0.8), vec3(0.15, 0.32, 0.68), sqrt(clamp(d.y, 0.0, 1.0))) * uDay;
  return c + uLightCol * (disk * smoothstep(0.99985, 0.99995, s) * 60.0 + (1.0 - disk) * pow(g, 900.0) * 7.0
                          + pow(g, 24.0) * 0.12 + g * g * g * g * 0.05 * (1.0 - abs(d.y)));
}
// what a ray reflected or refracted at p sees: the sky, plus the lamp's bulb when it looks at it
vec3 look(vec3 p, vec3 d) {
